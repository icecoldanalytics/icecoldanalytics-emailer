name: Fantasy Picks Email
on:
  workflow_dispatch:  # Manual trigger for testing
  # Cron disabled until we've verified a real send:
  # schedule:
  #   - cron: '30 17 * * *'
  # Runs 30 minutes after grindline's fantasy pipeline writes fantasy.json
  # (its own cron is 17:00 UTC), so the date guard in fetch_fantasy_picks
  # should pass under normal operation.

jobs:
  send-fantasy-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run daily email script
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '5'
          EMAIL_MODE: 'fantasy'
        run: python daily_email.py
